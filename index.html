<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YIDU-彭 · 摄影师 / 剪辑师 / AI设计师</title>
<meta name="description" content="YIDU-彭 — 摄影师、剪辑师、AI 设计师。用镜头捕捉真实情绪，用剪辑构建叙事节奏，用 AI 拓展创意边界。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* ============ 设计系统：暗房 / 胶片刻度 ============ */
:root{
  --bg:#faf8f4;          /* 暖白底 */
  --bg-2:#f3f0e9;        /* 次级面 */
  --bg-3:#ffffff;        /* 卡片面 */
  --line:rgba(30,25,20,.1);
  --line-2:rgba(30,25,20,.18);
  --ink:#1c1917;         /* 深暖黑文字 */
  --ink-dim:rgba(28,25,23,.62);
  --ink-faint:rgba(28,25,23,.36);
  --accent:#c23a20;      /* 暗红：纪实摄影的"红衣衫" */
  --accent-soft:rgba(194,58,32,.08);
  --serif:'Playfair Display','Noto Serif SC',serif;
  --sans:'Noto Sans SC',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.8,.28,1);
  --maxw:1200px;
  --nav-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 胶片颗粒 */
body::after{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
::selection{background:var(--accent);color:#fff}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2e2a22;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3d382d}

/* ============ 加载动画 ============ */
#loader{
  position:fixed;inset:0;z-index:10000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .8s var(--ease),visibility .8s;
}
#loader.done{opacity:0;visibility:hidden}
.loader-name{font-family:var(--serif);font-size:clamp(24px,5vw,40px);letter-spacing:.35em;text-indent:.35em;color:var(--ink)}
.loader-bar{width:120px;height:1px;background:var(--line-2);overflow:hidden}
.loader-bar i{display:block;height:100%;width:40%;background:var(--accent);animation:loadslide 1.2s var(--ease) infinite}
@keyframes loadslide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ============ 顶部导航 ============ */
header{
  position:fixed;top:0;left:0;right:0;z-index:900;height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,48px);
  transition:background .5s var(--ease),backdrop-filter .5s,border-color .5s;
  border-bottom:1px solid transparent;
}
header.scrolled{background:rgba(250,248,244,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.logo{font-family:var(--serif);font-size:19px;letter-spacing:.14em;font-weight:700;display:flex;align-items:baseline;gap:10px;z-index:902}
.logo em{font-style:normal;color:var(--accent);font-size:13px;letter-spacing:.2em}
.nav-links{display:flex;gap:clamp(20px,3vw,44px);font-size:13.5px;letter-spacing:.22em}
.nav-links a{position:relative;padding:6px 2px;opacity:.75;transition:opacity .3s}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--accent);transition:width .35s var(--ease)}
.nav-links a:hover{opacity:1}
.nav-links a:hover::after{width:100%}
.menu-btn{display:none;z-index:902;width:42px;height:42px;position:relative}
.menu-btn span{position:absolute;left:8px;right:8px;height:1px;background:var(--ink);transition:transform .4s var(--ease),opacity .3s}
.menu-btn span:nth-child(1){top:16px}
.menu-btn span:nth-child(2){top:22px}
.menu-btn span:nth-child(3){top:28px}
.menu-btn.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menu-btn.open span:nth-child(2){opacity:0}
.menu-btn.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* 全屏菜单 */
#fullmenu{
  position:fixed;inset:0;z-index:901;background:rgba(250,248,244,.97);
  backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s;
}
#fullmenu.open{opacity:1;visibility:visible}
#fullmenu nav{display:flex;flex-direction:column;gap:8px;text-align:center}
#fullmenu nav a{
  font-family:var(--serif);font-size:clamp(34px,8vw,60px);letter-spacing:.18em;color:var(--ink-dim);
  padding:10px 20px;transition:color .35s,transform .35s var(--ease);transform:translateY(14px);opacity:0;
}
#fullmenu.open nav a{transform:translateY(0);opacity:1;transition:opacity .5s var(--ease),transform .5s var(--ease),color .3s}
#fullmenu nav a:hover{color:var(--accent)}
#fullmenu .fm-foot{
  position:absolute;bottom:34px;left:0;right:0;text-align:center;color:var(--ink-faint);
  font-size:11px;letter-spacing:.3em;
}

/* ============ 首页：全屏焦点图 ============ */
#hero{
  position:relative;height:100svh;min-height:560px;overflow:hidden;background:var(--bg);
}
.hero-bg{position:absolute;inset:0}
.hero-slide{
  position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;background-size:cover;background-position:center;
  transform:scale(1.06);
}
.hero-slide.active{opacity:1;animation:herozoom 8s ease forwards}
@keyframes herozoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.hero-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(250,248,244,.72) 0%,rgba(250,248,244,.22) 42%,rgba(250,248,244,.88) 100%)}
.hero-inner{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 clamp(22px,6vw,80px) clamp(56px,9vh,100px);
}
.hero-overline{
  font-size:11px;letter-spacing:.42em;color:var(--accent);margin-bottom:18px;opacity:0;
  animation:rise .9s var(--ease) .35s forwards;
}
.hero-name{
  font-family:var(--serif);font-weight:700;font-size:clamp(52px,10vw,120px);line-height:1.02;
  letter-spacing:.04em;opacity:0;animation:rise 1s var(--ease) .55s forwards;
}
.hero-role{
  font-size:clamp(14px,2.2vw,20px);letter-spacing:.34em;color:var(--ink-dim);margin-top:20px;
  display:flex;gap:16px;flex-wrap:wrap;opacity:0;animation:rise 1s var(--ease) .75s forwards;
}
.hero-role b{color:var(--ink);font-weight:500}
.hero-quote{
  max-width:560px;margin-top:30px;padding-left:18px;border-left:2px solid var(--accent);
  font-family:var(--serif);font-style:italic;font-size:clamp(13px,1.6vw,16px);color:var(--ink-dim);
  opacity:0;animation:rise 1s var(--ease) .95s forwards;
}
.hero-quote cite{display:block;margin-top:8px;font-size:11px;letter-spacing:.3em;color:var(--ink-faint);font-style:normal}
.hero-scroll{
  position:absolute;right:clamp(22px,4vw,48px);bottom:34px;display:flex;align-items:center;gap:12px;
  writing-mode:vertical-rl;letter-spacing:.3em;font-size:11px;color:var(--ink-faint);
}
.hero-scroll::after{content:'';width:1px;height:44px;background:linear-gradient(var(--ink-faint),transparent);animation:scrollpulse 2s ease infinite}
@keyframes scrollpulse{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.hero-count{
  position:absolute;right:clamp(22px,4vw,48px);bottom:90px;font-family:var(--serif);font-size:12px;
  letter-spacing:.2em;color:var(--ink-faint);
}
.hero-count b{color:var(--ink);font-size:20px}

/* ============ 通用区块 ============ */
section{position:relative;padding:clamp(72px,10vw,130px) 0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.sec-head{margin-bottom:clamp(40px,6vw,70px);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.sec-index{font-family:var(--serif);color:var(--accent);font-size:13px;letter-spacing:.3em;margin-bottom:12px}
.sec-title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5vw,54px);letter-spacing:.06em}
.sec-title i{font-style:normal;color:var(--ink-faint);font-size:.5em;vertical-align:super;margin-left:6px;letter-spacing:0}
.sec-sub{max-width:420px;color:var(--ink-dim);font-size:13.5px;line-height:1.9}
.reveal{opacity:0;transform:translateY(36px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ============ 作品集 ============ */
#works{background:var(--bg-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:46px}
.filter{
  padding:9px 22px;border:1px solid var(--line-2);border-radius:999px;font-size:12.5px;letter-spacing:.18em;
  color:var(--ink-dim);transition:all .35s var(--ease);
}
.filter:hover{color:var(--ink);border-color:var(--ink-faint)}
.filter.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:flex;gap:clamp(14px,2vw,30px);align-items:flex-start;justify-content:center}
.col{display:flex;flex-direction:column;gap:clamp(14px,2vw,30px);flex:1;max-width:50%}
.col:last-child{max-width:50%}
.card{
  position:relative;overflow:hidden;cursor:pointer;background:var(--bg-3);
  border-radius:2px;box-shadow:0 1px 3px rgba(28,25,23,.05);width:100%;
}
.card img{width:100%;height:auto;display:block;transition:transform 1s var(--ease),opacity .6s;opacity:0}
.card img.loaded{opacity:1}
.card:hover img{transform:scale(1.02)}
.card::after{
  content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(250,248,244,.9));
  opacity:0;transition:opacity .5s;
}
.card:hover::after{opacity:1}
.card-meta{
  position:absolute;left:0;right:0;bottom:0;padding:18px;z-index:2;
  transform:translateY(12px);opacity:0;transition:transform .5s var(--ease),opacity .5s;
}
.card:hover .card-meta{transform:none;opacity:1}
.card-meta h3{font-size:15px;letter-spacing:.12em;font-weight:500}
.card-meta p{font-size:10.5px;letter-spacing:.26em;color:var(--ink-dim);margin-top:4px}
.card-hide{opacity:0;transform:scale(.94);pointer-events:none;position:absolute}
.grid{transition:grid-template-columns .5s}
.card{transition:opacity .5s var(--ease),transform .5s var(--ease)}

/* ============ 灯箱 ============ */
#lightbox{
  position:fixed;inset:0;z-index:950;background:rgba(250,248,244,.97);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s;
}
#lightbox.open{opacity:1;visibility:visible}
.lb-close{
  position:absolute;top:22px;right:24px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:18px;z-index:5;transition:all .3s;
}
.lb-close:hover{background:var(--accent);border-color:var(--accent)}
.lb-frame{max-width:min(1400px,92vw);max-height:80vh;display:flex;align-items:center;justify-content:center}
.lb-frame img{max-width:100%;max-height:78vh;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb-cap{text-align:center;margin-top:20px;padding:0 30px}
.lb-cap h3{font-family:var(--serif);font-size:19px;letter-spacing:.14em}
.lb-cap p{font-size:11px;letter-spacing:.3em;color:var(--ink-dim);margin-top:6px}
.lb-count{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;color:var(--ink-faint)}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:52px;height:76px;display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--ink-dim);transition:all .3s;z-index:4;
}
.lb-nav:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-thumbs{
  position:absolute;bottom:56px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
  padding:10px 14px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);
}
.lb-thumbs img{width:46px;height:46px;object-fit:cover;opacity:.4;cursor:pointer;transition:opacity .3s;border-radius:2px}
.lb-thumbs img.on{opacity:1;outline:1px solid var(--accent)}

/* ============ 关于 ============ */
#about{background:var(--bg)}
.about-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:clamp(30px,5vw,80px);align-items:start}
.about-portrait{position:relative}
.about-portrait .frame{
  aspect-ratio:3/4;overflow:hidden;border-radius:2px;position:relative;
}
.about-portrait .frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(.35) contrast(1.05)}
.about-portrait::before{
  content:'';position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--line-2);border-radius:2px;z-index:-1;
}
.about-badge{
  position:absolute;right:-8px;bottom:26px;background:var(--accent);color:#fff;padding:12px 18px;
  font-family:var(--serif);font-size:12px;letter-spacing:.18em;transform:rotate(-2deg);
}
.about-name{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px);letter-spacing:.1em;margin-bottom:6px}
.about-role{font-size:11.5px;letter-spacing:.34em;color:var(--accent);margin-bottom:30px}
.about-txt p{color:var(--ink-dim);margin-bottom:20px;font-size:15px}
.about-txt p strong{color:var(--ink);font-weight:500}
.about-stats{display:flex;gap:clamp(20px,4vw,56px);margin-top:36px;flex-wrap:wrap}
.stat b{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--ink);display:block;line-height:1.1}
.stat b em{font-style:normal;color:var(--accent)}
.stat span{font-size:10.5px;letter-spacing:.3em;color:var(--ink-faint)}
.certs{margin-top:44px;border-top:1px solid var(--line);padding-top:34px}
.certs h4{font-size:12px;letter-spacing:.3em;color:var(--ink-faint);margin-bottom:20px}
.cert{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.cert b{font-size:14.5px;font-weight:500;flex:1}
.cert span{font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
.skills{margin-top:44px;border-top:1px solid var(--line);padding-top:34px}
.skills h4{font-size:12px;letter-spacing:.3em;color:var(--ink-faint);margin-bottom:22px}
.skill{display:grid;grid-template-columns:90px 1fr 40px;gap:16px;align-items:center;margin-bottom:16px}
.skill span{font-size:13px;letter-spacing:.14em}
.skill .bar{height:2px;background:var(--line);position:relative;overflow:hidden}
.skill .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width 1.2s var(--ease)}
.skill b{font-size:12px;color:var(--ink-dim);text-align:right;font-weight:400}

/* ============ 联系 ============ */
#contact{background:var(--bg-2)}
.contact-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(30px,5vw,80px);align-items:center}
.contact-big{font-family:var(--serif);font-size:clamp(26px,4.5vw,46px);line-height:1.4;letter-spacing:.05em}
.contact-big em{font-style:normal;color:var(--accent)}
.contact-desc{color:var(--ink-dim);margin:26px 0 40px;font-size:14.5px;max-width:460px}
.contact-ways{display:flex;flex-direction:column;gap:14px}
.cway{
  display:flex;align-items:center;gap:20px;padding:22px 26px;border:1px solid var(--line-2);
  border-radius:2px;transition:all .4s var(--ease);background:var(--bg-3);
}
.cway:hover{border-color:var(--accent);transform:translateX(8px)}
.cway .ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .4s}
.cway:hover .ic{background:var(--accent);border-color:var(--accent)}
.cway .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}
.cway b{display:block;font-size:16px;letter-spacing:.08em;font-weight:500}
.cway small{color:var(--ink-faint);font-size:10.5px;letter-spacing:.26em}
.cway .go{margin-left:auto;color:var(--ink-faint);font-size:20px;transition:transform .3s}
.cway:hover .go{transform:translateX(4px);color:var(--accent)}

/* 社交平台导航 */
.contact-social{margin-top:40px;padding-top:34px;border-top:1px solid var(--line)}
.social-tag{font-size:12px;letter-spacing:.3em;color:var(--ink-faint);margin-bottom:20px}
.social-row{display:flex;gap:14px;flex-wrap:wrap}
.social-btn{
  display:flex;align-items:center;gap:12px;padding:15px 22px;border:1px solid var(--line-2);border-radius:2px;
  background:var(--bg-3);transition:all .35s var(--ease);min-width:150px;
}
.social-btn:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(28,25,23,.08)}
.social-btn .s-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-size:13px;font-weight:700}
.social-btn .s-ic svg{width:18px;height:18px;fill:#fff}
.social-btn b{display:block;font-size:14px;letter-spacing:.1em;font-weight:500}
.social-btn small{color:var(--ink-faint);font-size:10.5px;letter-spacing:.16em}
.s-ic.douyin{background:#111}
.s-ic.bili{background:#fb7299}
.s-ic.xhs{background:#ff2442}
.s-ic.weibo{background:#e6162d}

/* ============ 页脚 ============ */
footer{padding:44px 0;border-top:1px solid var(--line);text-align:center;color:var(--ink-faint);font-size:11px;letter-spacing:.28em}
footer b{color:var(--ink-dim);font-weight:400}

/* ============ 响应式 ============ */
@media (max-width:860px){
  .nav-links{display:none}
  .menu-btn{display:block}
  .about-grid{grid-template-columns:1fr}
  .about-portrait{max-width:340px;margin:0 auto 50px}
  .contact-grid{grid-template-columns:1fr}
  .grid,.col{gap:10px}
  .lb-thumbs{display:none}
  .lb-nav{width:44px}
  .hero-count{display:none}
}
@media (max-width:480px){
  .grid,.col{gap:8px}
  .card-meta{padding:10px}
  .card-meta h3{font-size:12px}
  .card-meta p{font-size:9px;letter-spacing:.14em}
  .hero-quote{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<!-- 加载动画 -->
<div id="loader">
  <div class="loader-name">YIDU·彭</div>
  <div class="loader-bar"><i></i></div>
</div>

<!-- 顶栏 -->
<header id="header">
  <a class="logo" href="#hero">YIDU·彭 <em>PHOTOGRAPHER</em></a>
  <nav class="nav-links">
    <a href="#works">作品集</a>
    <a href="#about">关于</a>
    <a href="#contact">联系</a>
  </nav>
  <button class="menu-btn" id="menuBtn" aria-label="菜单"><span></span><span></span><span></span></button>
</header>

<!-- 全屏菜单 -->
<div id="fullmenu">
  <nav>
    <a href="#works" data-close>作品集</a>
    <a href="#about" data-close>关于</a>
    <a href="#contact" data-close>联系</a>
  </nav>
  <div class="fm-foot" id="fmFoot"></div>
</div>

<!-- 首页 -->
<section id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-veil"></div>
  <div class="hero-count" id="heroCount"></div>
  <div class="hero-inner">
    <div class="hero-overline" id="heroOverline"></div>

  <div class="lb-thumbs" id="lbThumbs"></div>

<script src="data/site.js?v=20260812v2"></script>
<script src="data/works.js?v=20260812v2"></script>
<script>
/* ================= 数据 ================= */
const SITE = Object.assign({
  hero:{image:'',overline:'',name:'',role:[],quote:'',quoteAuth:''},
  about:{portrait:'',name:'',paragraphs:[],strengths:[],facts:[]},
  resume:{byline:'',skills:[],tools:[],education:[],certificates:[]},
  contact:{title:'',sub:'',email:'',phone:'',services:''},
  foot:{text:''}
}, window.__SITE_DATA__ || {});
let WORKS = (window.__WORKS_DATA__ && window.__WORKS_DATA__.works) || [];

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

/* 图片懒加载 + 加载完成态 */
function lazyImg(src,onload){
  const img = new Image();
  img.src = src;
  if(img.complete){onload&&onload();return img}
  img.onload = onload;
  return img;
}

/* ================= 首页 Hero ================= */
function renderHero(){
  const h = SITE.hero;
  $('#heroOverline').textContent = h.overline || '';
  $('#heroName').textContent = h.name || '';
  const roleHtml = (h.role||[]).map((r,i)=>
    `<span>${i>0?'<span style="color:var(--accent)">/</span> ':''}<b>${esc(r)}</b></span>`).join('');
  $('#heroRole').innerHTML = roleHtml;
  if(h.quote){
    $('#heroQuote').innerHTML = `<p>${esc(h.quote)}</p><cite>${esc(h.quoteAuth||'')}</cite>`;
  }
  /* 焦点图：优先用 hero.image，否则用作品集里前几张（横竖搭配） */
  const candidates = [];
  if(h.image) candidates.push('images/'+h.image);
  WORKS.slice(0,6).forEach(w=>candidates.push(w.img));
  const uniq = [...new Set(candidates)].filter(Boolean);
  const slides = uniq.slice(0,4);
  const bg = $('#heroBg');
  slides.forEach((src,i)=>{
    const d = document.createElement('div');
    d.className = 'hero-slide'+(i===0?' active':'');
    d.style.backgroundImage = `url(${JSON.stringify(src)})`;
    d.style.opacity = i===0 ? '' : '0';
    bg.appendChild(d);
  });
  if(slides.length>1){
    $('#heroCount').innerHTML = `<b>01</b> / ${String(slides.length).padStart(2,'0')}`;
    let cur = 0;
    const els = bg.children;
    setInterval(()=>{
      els[cur].classList.remove('active');
      cur = (cur+1)%els.length;
      els[cur].classList.add('active');
      $('#heroCount').innerHTML = `<b>${String(cur+1).padStart(2,'0')}</b> / ${String(slides.length).padStart(2,'0')}`;
    }, 5200);
  }
}

/* ================= 作品集 ================= */
function renderWorks(){
  $('#worksSub').textContent = `共 ${WORKS.length} 幅作品 · 点击查看大图`;
  /* 分类 */
  const cats = ['全部', ...new Set(WORKS.map(w=>w.cat).filter(Boolean))];
  const fc = $('#filters');
  cats.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'filter'+(i===0?' on':'');
    b.textContent = c;
    b.dataset.cat = c;
    b.onclick = ()=>filterWorks(c);
    fc.appendChild(b);
  });
  drawGrid(WORKS);
}
function drawGrid(list){
  const g = $('#grid');
  g.innerHTML = '';
  /* 两列容器 */
  const colA = document.createElement('div');
  colA.className = 'col';
  const colB = document.createElement('div');
  colB.className = 'col';
  g.appendChild(colA);
  g.appendChild(colB);
  /* 记录每列累计高度（以比例衡量） */
  let hA = 0, hB = 0;
  list.forEach((w,idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.wid = w.id;
    const img = document.createElement('img');
    img.alt = w.title || '未命名';
    img.loading = 'lazy';
    /* 直接设置 src，浏览器自动懒加载 + 缓存 */
    img.src = w.img;
    img.onload = ()=>img.classList.add('loaded');
    card.appendChild(img);
    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.innerHTML = `<h3>${esc(w.title||'未命名')}</h3><p>${esc(w.sub||w.cat||'')}</p>`;
    card.appendChild(meta);
    /* 预取真实宽高比，用于均衡分配（缓存命中则同步） */
    const probe = new Image();
    probe.onload = ()=>{
      const ratio = probe.naturalWidth && probe.naturalHeight ? probe.naturalWidth/probe.naturalHeight : 4/5;
      const itemH = 1/ratio;
      /* 贪心均衡：放到哪列后两列高度差更小，就放哪列 */
      const diffA = Math.abs((hA + itemH) - hB);
      const diffB = Math.abs(hA - (hB + itemH));
      if(diffA <= diffB){ colA.appendChild(card); hA += itemH; }
      else { colB.appendChild(card); hB += itemH; }
    };
    probe.onerror = ()=>{
      const itemH = 4/5;
      if(hA <= hB){ colA.appendChild(card); hA += itemH; } else { colB.appendChild(card); hB += itemH; }
    };
    probe.src = w.img;
    card.onclick = ()=>openLightbox(w.id);
  });
}
function filterWorks(cat){
  $$('.filter').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));
  const list = cat==='全部' ? WORKS : WORKS.filter(w=>w.cat===cat);
  drawGrid(list);
  /* 滚动回网格顶 */
  const r = $('#grid').getBoundingClientRect();
  if(r.top < 0) $('#works').scrollIntoView({behavior:'smooth'});
}

/* ================= 灯箱 ================= */
let lbList = [], lbIdx = 0;
function openLightbox(id){
  const w = WORKS.find(x=>x.id===id) || WORKS[0];
  const curCat = $$('.filter.on')[0]?.dataset.cat || '全部';
  lbList = curCat==='全部' ? WORKS : WORKS.filter(x=>x.cat===curCat);
  lbIdx = lbList.findIndex(x=>x.id===id);
  if(lbIdx<0) lbIdx = 0;
  $('#lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
  showLb();
  buildThumbs();
}
function showLb(){
  const w = lbList[lbIdx];
  $('#lbImg').src = w.img;
  $('#lbTitle').textContent = w.title || '未命名';
  $('#lbSub').textContent = w.sub || w.cat || '';
  $('#lbCount').textContent = `${lbIdx+1} / ${lbList.length}`;
  $$('.lb-thumbs img').forEach((t,i)=>t.classList.toggle('on',i===lbIdx));
}
function lbMove(d){
  lbIdx = (lbIdx + d + lbList.length) % lbList.length;
  showLb();
}
function buildThumbs(){
  const t = $('#lbThumbs');
  t.innerHTML = '';
  lbList.forEach((w,i)=>{
    const im = document.createElement('img');
    im.src = w.img;
    im.className = i===lbIdx?'on':'';
    im.onclick = ()=>{lbIdx=i;showLb()};
    t.appendChild(im);
  });
}
function closeLb(){
  $('#lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick = ()=>lbMove(-1);
$('#lbNext').onclick = ()=>lbMove(1);
document.addEventListener('keydown',e=>{
  if(!$('#lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')lbMove(-1);
  if(e.key==='ArrowRight')lbMove(1);
});
/* 触摸滑动 */
let tx=0,ty=0;
$('#lightbox').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;});
$('#lightbox').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)) lbMove(dx<0?1:-1);
});

/* ================= 关于 ================= */
function renderAbout(){
  const a = SITE.about, r = SITE.resume;
  if(a.portrait) $('#aboutPortrait').src = 'images/'+a.portrait;
  $('#aboutName').textContent = a.name || '';
  $('#aboutRole').textContent = (SITE.hero.overline||'').replace(/·/g,'·').trim() || '';
  $('#aboutBadge').textContent = (SITE.hero.role||[]).join(' · ') || '';
  $('#aboutTxt').innerHTML = (a.paragraphs||[]).map(p=>{
    /* 支持 **加粗** 标记 */
    const html = esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    return `<p>${html}</p>`;
  }).join('');
  /* 数据统计：技能/证书数量 + 年限 */
  const stats = [
    {v:(r.skills||[]).length+'', l:'项专业技能'},
    {v:(r.certificates||[]).filter(c=>c.title).length+'', l:'项获奖记录'},
    {v:'∞', l:'创作热情'}
  ];
  $('#aboutStats').innerHTML = stats.map(s=>`<div class="stat"><b>${s.v}</b><span>${s.l}</span></div>`).join('');
  /* 证书 */
  const certs = (r.certificates||[]).filter(c=>c.title);
  $('#certs').innerHTML = certs.length ? certs.map(c=>
    `<div class="cert"><b>${esc(c.title)}</b><span>${esc(c.meta||'')}</span></div>`).join('')
    : '<div class="cert"><b>暂无</b></div>';
  /* 技能条 */
  $('#skills').innerHTML = (r.skills||[]).map(s=>
    `<div class="skill"><span>${esc(s.name)}</span><div class="bar"><i data-v="${s.value||0}"></i></div><b>${s.value||0}%</b></div>`).join('');
  /* 技能条动画 */
  const io = new IntersectionObserver((es,ob)=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        $$('.skill .bar i').forEach(i=>i.style.width = (i.dataset.v||0)+'%');
        ob.disconnect();
      }
    });
  },{threshold:.3});
  const sk = $('#skills');
  if(sk) io.observe(sk);
}

/* ================= 联系 ================= */
/* 社交平台图标 */
const SOCIAL_ICONS = {
  '抖音': '<svg viewBox="0 0 24 24"><path d="M19.6 7.1a5.2 5.2 0 0 1-3.6-1.6 5.2 5.2 0 0 1-1.5-3.5h-3.2v13.3a3 3 0 1 1-2.1-2.9V9.1a6.2 6.2 0 1 0 5.3 6.1V9.7a8.4 8.4 0 0 0 5.1 1.7V8.3c0-.4 0-.8-.1-1.2h.1Z"/></svg>',
  '哔哩哔哩': '<svg viewBox="0 0 24 24"><path d="M18.2 3.6 20 5.4l-1.9 1.9a9 9 0 0 1 2.9 6.6v3.4a2.7 2.7 0 0 1-2.7 2.7H5.7a2.7 2.7 0 0 1-2.7-2.7v-3.4a9 9 0 0 1 2.9-6.6L4 5.4 5.8 3.6l2.4 2.4h7.6l2.4-2.4ZM8.6 9.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm6.8 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm-7 4.3 3.5 2.6 3.5-2.6-1-1.4-2.5 1.9-2.5-1.9-1 1.4Z"/></svg>',
  '小红书': '<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2Zm4.9 12.5c-.6.6-1.4.9-2.3.9-.5 0-1-.1-1.4-.2-.4.5-1 .8-1.6.9-.2.2-.5.3-.8.3-.8 0-1.4-.6-1.4-1.4 0-.4.2-.8.5-1.1-.3-.5-.4-1.1-.4-1.7 0-2 1.7-3.7 3.7-3.7 2 0 3.7 1.7 3.7 3.7v1.1c.7.3 1.2 1 1.2 1.8 0 .3-.1.6-.2.8Z"/></svg>',
  '微博': '<svg viewBox="0 0 24 24"><path d="M10.5 17.4c-3.6.3-6.6-1-6.6-3 0-2 3-3.6 6.6-3.9 3.6-.3 6.6 1 6.6 3 0 2-3 3.6-6.6 3.9Zm7.3-6.6c-.4.2-.8 0-1-.4-.3-.7-.7-1.1-1.5-1.5-1.1-.6-2.7-.6-4.5-.5-.4 0-.9-.1-.9-.5 0-.4.4-.5.8-.5 2.2-.2 4.3-.1 5.7.6 1.4.7 2.2 1.7 2.6 2.7.1.4-.5.6-1.2.4Zm-1.2 1.3c-.3.1-.6 0-.8-.3-.2-.4-.5-.8-1.1-1-.7-.3-1.7-.4-2.9-.4-.3 0-.7-.1-.7-.4 0-.3.3-.4.6-.4 1.5-.1 2.8 0 3.7.4 1 .5 1.6 1.1 1.9 1.8.1.3 0 .5-.4.6Zm-1.9 4.1c1.5-.6 2.5-1.8 2.3-2.9-.1-.7-.7-1.3-1.5-1.6-1-.4-2.3-.6-3.7-.6-2.9-.1-5.4.8-5.9 2.5-.4 1.2.6 2.4 2.3 3.1 1.4.7 3.2 1 5.1.6 1-.2 1.9-.6 2.6-1.1-.7.5-1.6.8-2.6 1h-.1c-.4.1-.9.2-1.3.2-1.5 0-2.9-.4-3.8-1.1-.8-.6-1.1-1.3-.9-1.9.3-.8 1.6-1.5 3.5-1.8.9-.1 1.9-.2 2.9-.2.7 0 1.4 0 2 .1.8.1 1.3.5 1.4.9.2.6-.4 1.4-1.5 1.9l.1-.1Z"/></svg>'
};
function renderContact(){
  const c = SITE.contact;
  const role = (SITE.hero.role||[]).join(' · ') || '约拍 / 合作';
  $('#contactBig').innerHTML = (c.title||'期待与您共创好作品').replace(/期待/,'<em>期待</em>');
  $('#contactDesc').textContent = c.sub || '';
  const ph = $('#cwayPhone'), ml = $('#cwayMail');
  $('#phoneTxt').textContent = c.phone || '';
  $('#mailTxt').textContent = c.email || '';
  ph.href = c.phone ? 'tel:'+c.phone.replace(/\s/g,'') : '#contact';
  ml.href = c.email ? 'mailto:'+c.email : '#contact';
  $('#fmFoot').textContent = (c.email||'') + ' · ' + (c.phone||'');
  /* 社交平台 */
  const socials = c.social || [];
  const row = document.querySelector('#contactSocial .social-row');
  if(socials.length && row){
    row.innerHTML = socials.map(s=>{
      const key = Object.keys(SOCIAL_ICONS).find(k=>s.name.includes(k)) || s.name;
      const cls = s.name.includes('抖音')?'douyin':s.name.includes('哔哩')?'bili':s.name.includes('微博')?'weibo':'xhs';
      const ic = SOCIAL_ICONS[key] || '';
      return `<a class="social-btn" href="${esc(s.url||'#')}" target="_blank" rel="noopener">
        <span class="s-ic ${cls}">${ic}</span>
        <div><b>${esc(s.name)}</b><small>${esc(s.handle||'')}</small></div>
      </a>`;
    }).join('');
  } else if(row){
    row.innerHTML = '';
  }
}
/* ================= 页脚 ================= */
function renderFoot(){
  $('#footTxt').innerHTML = esc(SITE.foot.text||'');
}

/* ================= 导航 ================= */
const header = $('#header');
window.addEventListener('scroll',debounce(()=>{
  header.classList.toggle('scrolled', window.scrollY > 40);
},50),{passive:true});
const menuBtn = $('#menuBtn'), fullmenu = $('#fullmenu');
menuBtn.onclick = ()=>{
  const open = fullmenu.classList.toggle('open');
  menuBtn.classList.toggle('open',open);
  document.body.style.overflow = open?'hidden':'';
};
$$('#fullmenu a').forEach(a=>a.onclick=()=>{
  fullmenu.classList.remove('open');
  menuBtn.classList.remove('open');
  document.body.style.overflow='';
});

/* ================= 滚动显现 ================= */
const revIO = new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');revIO.unobserve(e.target)}});
},{threshold:.12});
function watchReveals(){
  $$('.reveal').forEach(el=>revIO.observe(el));
}
/* 平滑锚点 */
$$('a[href^="#"]').forEach(a=>{
  a.addEventListener('click',e=>{
    const t = document.querySelector(a.getAttribute('href'));
    if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth'})}
  });
});

/* ================= 初始化 ================= */
async function init(){
  renderHero();
  renderWorks();
  renderAbout();
  renderContact();
  renderFoot();
  watchReveals();
  /* 加载完成 */
  setTimeout(()=>$('#loader').classList.add('done'), 900);
}
/* 字体加载完成后显示，避免 FOIT 闪烁 */
init();
</script>
